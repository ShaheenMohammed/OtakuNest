spring:
  application:
    name: otakunest-server
  datasource:
    url: jdbc:postgresql://localhost:5432/otakunest
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # For dev; will change to validate/flyway in prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

spring:
  application:
    name: Otaku Nest Backend

  datasource:
    url: jdbc:postgresql://localhost:5332/ON_DB
    username: OtakuNest
    password: openNest
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
